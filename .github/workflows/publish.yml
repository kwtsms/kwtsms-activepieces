# FILE:    .github/workflows/publish.yml
# CREATED: 2026-11-17 14:12 +03
# WHAT:    On a v* tag (or a manual run naming an existing tag): tests, build, npm publish with provenance, then a
#          GitHub release with the CHANGELOG section.
# WHY:     Same release path as kwtsms-mcp and kwtsms-otp. The first publish uses the NPM_TOKEN secret once; then npm
#          trusted publishing (OIDC) is set on the package and the secret is deleted.
name: Publish to npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to finish publishing, for example v0.1.0'
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Version matches the tag
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: npm publish (skipped when npm already has this version)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V="${TAG#v}"
          if npm view "@kwtsms/piece-kwtsms@$V" version >/dev/null 2>&1; then echo "npm already has $V"; exit 0; fi
          npm publish --access public --provenance --ignore-scripts
      - name: GitHub release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          awk "/^## \\[${V}\\]/{f=1; next} /^## \\[/{if(f) exit} f{print}" CHANGELOG.md > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --latest --notes-file /tmp/notes.md
